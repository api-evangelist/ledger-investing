aid: ledger-investing
name: Ledger Investing
description: 'Ledger Investing is a New York-based specialist broking and advisory firm for casualty
  insurance-linked securities (ILS), connecting insurers, reinsurers and fronting carriers to institutional
  capital markets investors. The firm originates casualty risk, structures off-balance-sheet solutions,
  brokes and distributes the resulting securities, and supports secondary trading, having securitized
  more than $2.5 billion of casualty premium across 170+ transactions since graduating Y Combinator in
  2017. Its wholly owned SaaS subsidiary Korra Tech, LLC operates the Korra open data and analytics
  platform for the reinsurance and ILS market, whose Ledger Analytics API gives actuaries programmatic
  remote-compute access to Bayesian loss development, tail and forecasting models over insurance loss
  triangles, alongside the open-source Bermuda (loss triangle manipulation) and BayesBlend (Bayesian
  model stacking) Python libraries. Other subsidiaries include Ledger Capital Markets, LLC (SEC-registered
  broker-dealer, FINRA/SIPC member) and Ledger Risk Markets, LLC (licensed reinsurance intermediary).'
